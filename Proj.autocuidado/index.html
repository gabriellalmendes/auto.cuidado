<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>CareMind - Autocuidado</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f0f4f8; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 350px; text-align: center; }
        h1 { color: #2c3e50; margin-bottom: 5px; }
        p { color: #7f8c8d; font-size: 14px; }
        input { width: 100%; padding: 12px; margin: 20px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #3498db; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        button:hover { background: #2980b9; }
        #resultado { margin-top: 20px; padding: 15px; background: #e8f6ff; border-radius: 8px; display: none; text-align: left; border-left: 5px solid #3498db; }
    </style>
</head>
<body>
    <div class="card">
        <h1>💧 CareMind</h1>
        <p>Resolvendo a dor do esquecimento do autocuidado diário.</p>
        <input type="number" id="peso" placeholder="Digite seu peso (ex: 70)">
        <button onclick="gerarPlano()">Ver minha meta</button>
        <div id="resultado">
            <div id="metaAgua"></div>
            <div id="dicaHora" style="margin-top:10px; font-size: 13px;"></div>
        </div>
    </div>

    <script src="logic.js"></script>
    <script>
        function gerarPlano() {
            const peso = parseFloat(document.getElementById('peso').value);
            if (!peso || peso <= 0) { alert("Peso inválido"); return; }
            
            const meta = calcularMetaAgua(peso);
            const hora = new Date().getHours();
            
            document.getElementById('metaAgua').innerHTML = `🥤 Meta de Água: <strong>${meta}ml</strong>`;
            document.getElementById('dicaHora').innerHTML = `💡 <strong>Dica:</strong> ${obterSugestaoChecklist(hora)}`;
            document.getElementById('resultado').style.display = 'block';
        }
    </script>
</body>
</html>
